# Minimal stand-in for an OpenAI-compatible inference server (same endpoints as vLLM).
# Loading the model weights takes MODEL_LOAD_SECONDS after the process starts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-server
  labels:
    app: llm-gateway
data:
  server.py: |
    import http.server, json, os, threading, time

    MODEL = os.environ.get("MODEL_NAME", "support-llm")
    LOAD_SECONDS = int(os.environ.get("MODEL_LOAD_SECONDS", "20"))
    state = {"loaded": False}

    def load_weights():
        time.sleep(LOAD_SECONDS)
        state["loaded"] = True
        print(f"model {MODEL} loaded in {LOAD_SECONDS}s", flush=True)

    class Handler(http.server.BaseHTTPRequestHandler):
        def reply(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/health":
                return self.reply(200, {"status": "ok"})
            if self.path == "/v1/models":
                if state["loaded"]:
                    return self.reply(200, {"object": "list", "data": [{"id": MODEL}]})
                return self.reply(503, {"error": "model is loading"})
            if self.path.startswith("/v1/completions"):
                if state["loaded"]:
                    return self.reply(200, {"model": MODEL, "choices": [{"text": "Your order ships tomorrow."}]})
                return self.reply(503, {"error": "model not loaded yet"})
            self.reply(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            if args and str(args[1]) != "200":
                print("%s %s" % (self.address_string(), fmt % args), flush=True)

    print(f"starting server, loading {MODEL}", flush=True)
    threading.Thread(target=load_weights, daemon=True).start()
    http.server.ThreadingHTTPServer(("", 8000), Handler).serve_forever()
